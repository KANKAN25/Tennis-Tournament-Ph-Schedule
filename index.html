<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tennis PH Time</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0f0a; --card:#161d16; --accent:#c8f04a;
    --text:#e8f5e8; --muted:#5a7a5a; --border:#1e2d1e; --live:#ff4a4a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse 60% 40% at 80% 10%,rgba(200,240,74,.05) 0%,transparent 60%),
               radial-gradient(ellipse 40% 60% at 10% 80%,rgba(74,240,138,.04) 0%,transparent 60%);}
  .wrap{max-width:980px;margin:0 auto;padding:0 20px 60px;position:relative;z-index:1;}

  header{padding:50px 0 30px;display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:1px solid var(--border);margin-bottom:40px;}
  .logo h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(48px,8vw,80px);
    letter-spacing:2px;line-height:.9;color:var(--accent);}
  .logo p{color:var(--muted);font-size:12px;letter-spacing:3px;text-transform:uppercase;margin-top:8px;}
  .clock{text-align:right;}
  .clock .t{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:2px;color:var(--accent);}
  .clock .l{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);}
  .clock .d{font-size:12px;color:var(--muted);margin-top:2px;}

  .filters{display:flex;gap:10px;margin-bottom:30px;flex-wrap:wrap;align-items:center;}
  .fbtn{background:none;border:1px solid var(--border);color:var(--muted);padding:8px 18px;
    border-radius:100px;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;transition:all .2s;}
  .fbtn:hover,.fbtn.on{background:var(--accent);border-color:var(--accent);color:#0a0f0a;font-weight:500;}
  .mcount{margin-left:auto;font-size:12px;color:var(--muted);}

  .tgroup{margin-bottom:40px;}
  .thead{display:flex;align-items:center;gap:14px;margin-bottom:14px;
    padding-bottom:10px;border-bottom:1px solid var(--border);}
  .tname{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1px;}
  .tcat{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;}

  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:16px 20px;margin-bottom:8px;
    display:grid;grid-template-columns:1fr auto 1fr auto;align-items:center;gap:12px;
    transition:border-color .2s,transform .15s;animation:up .35s ease both;}
  .card:hover{border-color:rgba(200,240,74,.35);transform:translateY(-1px);}
  .card.live{border-color:rgba(255,74,74,.4);background:linear-gradient(135deg,var(--card),rgba(255,74,74,.05));}
  .card.done{opacity:.5;}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

  .player{display:flex;flex-direction:column;gap:3px;}
  .pname{font-weight:500;font-size:15px;line-height:1.2;}
  .pc{font-size:11px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-top:1px;}
  .player.r{text-align:right;}

  .vsb{text-align:center;min-width:100px;padding:0 4px;}
  .vs{font-family:'Bebas Neue',sans-serif;font-size:15px;color:var(--muted);letter-spacing:2px;}
  .sets-row{display:flex;justify-content:center;gap:6px;margin-bottom:2px;flex-wrap:wrap;}
  .set-score{font-family:'Bebas Neue',sans-serif;font-size:13px;color:var(--accent);letter-spacing:1px;}
  .total-score{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--accent);letter-spacing:2px;}
  .rl{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:3px;}

  .timeb{text-align:right;min-width:115px;}
  .pht{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1px;color:var(--accent);}
  .phtl{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
  .phd{font-size:11px;color:var(--muted);margin-top:2px;}

  .livebadge{display:inline-flex;align-items:center;gap:5px;background:var(--live);color:#fff;
    font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
    padding:2px 8px;border-radius:100px;margin-top:5px;}
  .ldot{width:5px;height:5px;background:#fff;border-radius:50%;animation:blink 1s infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
  .donebadge{font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;
    margin-top:4px;display:inline-block;}

  .loading{text-align:center;padding:80px 20px;color:var(--muted);}
  .spinner{width:40px;height:40px;border:2px solid var(--border);border-top-color:var(--accent);
    border-radius:50%;animation:rot .8s linear infinite;margin:0 auto 20px;}
  @keyframes rot{to{transform:rotate(360deg)}}

  .empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:14px;line-height:2;}
  .errbx{background:rgba(255,74,74,.08);border:1px solid rgba(255,74,74,.3);border-radius:12px;
    padding:20px 24px;color:#ff9a9a;font-size:14px;margin-bottom:16px;line-height:1.9;}
  .errbx code{background:rgba(255,255,255,.07);padding:2px 8px;border-radius:4px;
    font-family:monospace;font-size:13px;color:var(--accent);}

  .rfbtn{background:none;border:1px solid var(--border);color:var(--muted);padding:10px 24px;
    border-radius:100px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;
    letter-spacing:1px;transition:all .2s;display:flex;align-items:center;gap:8px;margin:24px auto 0;}
  .rfbtn:hover{border-color:var(--accent);color:var(--accent);}
  .rfbtn:disabled{opacity:.4;cursor:default;}
  .ri{display:inline-block;}
  .ri.sp{animation:rot .6s linear infinite;}

  .foot{text-align:center;color:var(--muted);font-size:11px;letter-spacing:1px;
    margin-top:50px;padding-top:20px;border-top:1px solid var(--border);}

  @media(max-width:620px){
    .card{grid-template-columns:1fr auto 1fr;}
    .timeb{grid-column:1/-1;text-align:center;border-top:1px solid var(--border);padding-top:10px;
      display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;}
    header{flex-direction:column;align-items:flex-start;gap:16px;}
    .clock{text-align:left;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <h1>TENNIS<br>PH TIME</h1>
      <p>All times in Philippine Standard Time (UTC+8)</p>
    </div>
    <div class="clock">
      <div class="l">Philippine Time Now</div>
      <div class="t" id="clk">--:--:--</div>
      <div class="d" id="cld">---</div>
    </div>
  </header>

  <div class="filters">
    <button class="fbtn on" data-f="all"      onclick="setF('all')">All</button>
    <button class="fbtn"    data-f="live"     onclick="setF('live')">🔴 Live</button>
    <button class="fbtn"    data-f="upcoming" onclick="setF('upcoming')">Upcoming</button>
    <button class="fbtn"    data-f="finished" onclick="setF('finished')">Finished</button>
    <span class="mcount" id="mc"></span>
  </div>

  <div id="main">
    <div class="loading"><div class="spinner"></div><div>Loading matches…</div></div>
  </div>

  <button class="rfbtn" id="rfbtn" onclick="load(true)">
    <span class="ri" id="ri">↻</span> Refresh
  </button>

  <div class="foot">Powered by SportDB.dev &amp; Flashscore · Times in PHT (UTC+8)</div>
</div>

<script>
// ── Clock ──────────────────────────────────────────────────────
function tick() {
  const ph = new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Manila'}));
  let h=ph.getHours(), m=String(ph.getMinutes()).padStart(2,'0'), s=String(ph.getSeconds()).padStart(2,'0');
  const ap=h>=12?'PM':'AM'; h=h%12||12;
  document.getElementById('clk').textContent=`${h}:${m}:${s} ${ap}`;
  document.getElementById('cld').textContent=ph.toLocaleDateString('en-PH',{
    weekday:'long',year:'numeric',month:'long',day:'numeric'});
}
setInterval(tick,1000); tick();

// ── Time ───────────────────────────────────────────────────────
function toPH(utime) {
  if (!utime) return null;
  return new Date(utime * 1000 + 8 * 3600000);
}
function fmt12(d) {
  if (!d) return 'TBD';
  let h=d.getUTCHours(), m=String(d.getUTCMinutes()).padStart(2,'0');
  const ap=h>=12?'PM':'AM'; h=h%12||12;
  return `${h}:${m} ${ap}`;
}
function fmtDate(d) {
  if (!d) return '';
  return d.toLocaleDateString('en-PH',{weekday:'short',month:'short',day:'numeric',timeZone:'UTC'});
}

// ── State ──────────────────────────────────────────────────────
let all=[], curF='all';
function setF(f){
  curF=f;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('on',b.dataset.f===f));
  render();
}
function e(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ── Render ─────────────────────────────────────────────────────
function render(){
  const main=document.getElementById('main');
  let list=all;
  if(curF==='live')     list=all.filter(m=>m.isLive);
  if(curF==='upcoming') list=all.filter(m=>!m.isLive&&!m.isDone);
  if(curF==='finished') list=all.filter(m=>m.isDone);

  document.getElementById('mc').textContent=`${list.length} match${list.length!==1?'es':''}`;

  if(!list.length){
    main.innerHTML=`<div class="empty">No matches for this filter.</div>`;
    return;
  }

  const groups={};
  list.forEach(m=>{
    const k=m.cat+'__'+m.tournament;
    if(!groups[k]) groups[k]={cat:m.cat,tournament:m.tournament,matches:[]};
    groups[k].matches.push(m);
  });

  let html='', delay=0;
  for(const g of Object.values(groups)){
    html+=`<div class="tgroup">
      <div class="thead">
        <div class="tname">${e(g.tournament)}</div>
        <div class="tcat">${e(g.cat)}</div>
      </div>`;

    for(const m of g.matches){
      const phDt=toPH(m.startUtime);
      const cls=m.isLive?'live':m.isDone?'done':'';

      // Score block
      let scoreHtml;
      if(m.sets && m.sets.trim()){
        const parts=m.sets.trim().split(/\s+/);
        const setsHtml=parts.map(s=>`<span class="set-score">${e(s)}</span>`).join(' ');
        scoreHtml=`<div class="sets-row">${setsHtml}</div><div class="total-score">${e(m.homeScore)}-${e(m.awayScore)}</div>`;
      } else if(m.homeScore||m.awayScore){
        scoreHtml=`<div class="total-score">${e(m.homeScore)}-${e(m.awayScore)}</div>`;
      } else {
        scoreHtml=`<div class="vs">VS</div>`;
      }

      const badge=m.isLive
        ?`<div class="livebadge"><span class="ldot"></span>LIVE</div>`
        :m.isDone?`<div class="donebadge">FINISHED</div>`:'';

      html+=`
        <div class="card ${cls}" style="animation-delay:${delay*35}ms">
          <div class="player">
            <div class="pname">${e(m.p1)}</div>
            <div class="pc">${e(m.p1c)}</div>
          </div>
          <div class="vsb">
            ${scoreHtml}
            ${m.round?`<div class="rl">${e(m.round)}</div>`:''}
          </div>
          <div class="player r">
            <div class="pname">${e(m.p2)}</div>
            <div class="pc">${e(m.p2c)}</div>
          </div>
          <div class="timeb">
            <div class="pht">${fmt12(phDt)}</div>
            <div class="phtl">PH Time</div>
            <div class="phd">${fmtDate(phDt)}</div>
            ${badge}
          </div>
        </div>`;
      delay++;
    }
    html+='</div>';
  }
  main.innerHTML=html;
}

// ── Load ───────────────────────────────────────────────────────
async function load(force=false){
  const main=document.getElementById('main');
  const btn=document.getElementById('rfbtn');
  const ri=document.getElementById('ri');

  main.innerHTML=`<div class="loading"><div class="spinner"></div><div>Loading…</div></div>`;
  btn.disabled=true; ri.classList.add('sp');

  try{
    const res=await fetch(`http://localhost:3456/matches${force?'?refresh=1':''}`);
    if(!res.ok) throw new Error(`Server error ${res.status}`);
    const data=await res.json();
    all=data.matches||[];
    if(!all.length){
      main.innerHTML=`<div class="empty">No matches found right now.<br><small>Try refreshing or check back later.</small></div>`;
    } else {
      render();
    }
  }catch(err){
    main.innerHTML=`<div class="errbx">
      ⚠️ <strong>${e(err.message)}</strong><br><br>
      Make sure the server is running:<br><code>node server.js</code>
    </div>`;
  }

  btn.disabled=false; ri.classList.remove('sp');
}

// Auto-refresh every 3 minutes
setInterval(()=>load(false), 3*60*1000);
load();
</script>
</body>
</html>
