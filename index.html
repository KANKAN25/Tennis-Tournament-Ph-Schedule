<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tennis PH Time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body class="app">
  <div class="app__background"></div>
  <main class="calendar-page">
    <header class="calendar-page__header">
      <div class="calendar-page__brand">
        <h1 class="calendar-page__title">TENNIS<br>PH TIME</h1>
        <p class="calendar-page__subtitle">All times in Philippine Standard Time (UTC+8)</p>
      </div>
      <section class="clock" aria-label="Philippine time now">
        <p class="clock__label">Philippine Time Now</p>
        <p class="clock__time" id="CLOCK_TIME">--:--:--</p>
        <p class="clock__date" id="CLOCK_DATE">---</p>
      </section>
    </header>

    <section class="filter-bar" id="FILTER_BAR" aria-label="Match filters"></section>
    <section class="match-list" id="MATCH_LIST" aria-live="polite"></section>

    <button class="refresh-button" id="REFRESH_BUTTON" type="button">
      <span class="refresh-button__icon" id="REFRESH_ICON" aria-hidden="true">&#8635;</span>
      <span class="refresh-button__label">Refresh</span>
    </button>

    <footer class="calendar-page__footer">Powered by SportDB.dev &amp; Flashscore &middot; Times in PHT (UTC+8)</footer>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
